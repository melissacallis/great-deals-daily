<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Daily Top 10 Pin | UBottega</title>
  <link rel="icon" href="/img/logo-badge.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fff5f8; color: #2a1030; }
    main { max-width: 560px; margin: 0 auto; padding: 18px 16px 48px; }
    h1 { font-family: Poppins, sans-serif; font-size: 24px; margin: 4px 0 6px; }
    p { margin: 6px 0 12px; line-height: 1.45; }
    .pin { width: 100%; height: auto; border-radius: 14px; box-shadow: 0 10px 30px -10px rgba(59,15,58,.45); background: #fff; display: block; }
    .btn { display: inline-block; border: 0; border-radius: 999px; padding: 13px 22px; font: 700 16px Inter, sans-serif; color: #fff; background: linear-gradient(135deg, #ff3d7f, #ff8a3d); cursor: pointer; text-decoration: none; margin: 14px 8px 0 0; }
    .btn.alt { background: #3b0f3a; }
    textarea { width: 100%; box-sizing: border-box; min-height: 150px; border: 2px solid #f5d6e2; border-radius: 12px; padding: 10px; font: 14px/1.45 Inter, sans-serif; }
    .field { margin-top: 18px; }
    .field b { display: block; margin-bottom: 6px; }
    code { background: #fff; padding: 2px 6px; border-radius: 6px; }
    .status { color: #7b5b6e; font-size: 14px; }
  </style>
  <script type="module" src="/consent.js"></script>
</head>
<body>
  <main>
    <h1>📌 Daily Top 10 Pin</h1>
    <p class="status" id="status">Loading today's Top 10…</p>
    <img class="pin" id="pin" alt="Today's Top 10 deals pin">
    <a class="btn" id="download" download>⬇️ Download pin</a>
    <button class="btn alt" id="redo" type="button">↻ Refresh</button>
    <p class="status">On iPhone: press and hold the pin image above → <b>Save to Photos</b> (or tap Download).</p>
    <div class="field"><b>Pin title</b><textarea id="title" rows="2" style="min-height:60px"></textarea></div>
    <div class="field"><b>Description</b><textarea id="desc"></textarea></div>
    <div class="field"><b>Link</b><code>https://www.ubottega.com/</code></div>
    <button class="btn alt" id="copy" type="button">📋 Copy title + description</button>
  </main>
  <script src="/pin.js" type="module"></script>
</body>
</html>
